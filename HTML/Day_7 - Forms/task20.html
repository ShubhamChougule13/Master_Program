<!-- Level 5 – Challenging Practice Tasks 
20. College Admission Form 
Create a complete college admission form.  -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Admission Form</title>
</head>

<body>

    <h1>College Admission Form</h1>

    <form autocomplete="on">

        <!-- Personal Information -->
        <fieldset>

            <legend><strong>Personal Information</strong></legend>

            <!-- Name -->
            <label for="name">Name:</label>
            <br>

            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your full name"
                   autocomplete="name"
                   required>

            <br><br>


            <!-- DOB -->
            <label for="dob">Date of Birth:</label>
            <br>

            <input type="date"
                   id="dob"
                   name="dob"
                   required>

            <br><br>


            <!-- Gender -->
            <label>Gender:</label>
            <br>

            <input type="radio"
                   id="male"
                   name="gender"
                   value="Male"
                   required>

            <label for="male">Male</label>

            <input type="radio"
                   id="female"
                   name="gender"
                   value="Female">

            <label for="female">Female</label>

            <input type="radio"
                   id="other"
                   name="gender"
                   value="Other">

            <label for="other">Other</label>

            <br><br>


            <!-- Email -->
            <label for="email">Email:</label>
            <br>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Enter your email"
                   autocomplete="email"
                   required>

            <br><br>


            <!-- Mobile -->
            <label for="mobile">Mobile:</label>
            <br>

            <input type="tel"
                   id="mobile"
                   name="mobile"
                   placeholder="Enter your mobile number"
                   autocomplete="tel"
                   required>

        </fieldset>

        <br>


        <!-- Academic Information -->
        <fieldset>

            <legend><strong>Academic Information</strong></legend>

            <!-- 10th Marks -->
            <label for="tenthMarks">10th Marks (%):</label>
            <br>

            <input type="number"
                   id="tenthMarks"
                   name="tenthMarks"
                   min="0"
                   max="100"
                   placeholder="Enter 10th marks"
                   required>

            <br><br>


            <!-- 12th Marks -->
            <label for="twelfthMarks">12th Marks (%):</label>
            <br>

            <input type="number"
                   id="twelfthMarks"
                   name="twelfthMarks"
                   min="0"
                   max="100"
                   placeholder="Enter 12th marks"
                   required>

            <br><br>


            <!-- Qualification -->
            <label for="qualification">Qualification:</label>
            <br>

            <select id="qualification"
                    name="qualification"
                    required>

                <option value="">-- Select Qualification --</option>
                <option value="12th">12th / HSC</option>
                <option value="Diploma">Diploma</option>
                <option value="Other">Other</option>

            </select>

            <br><br>


            <!-- Passing Year -->
            <label for="passingYear">Passing Year:</label>
            <br>

            <input type="number"
                   id="passingYear"
                   name="passingYear"
                   min="2000"
                   max="2030"
                   placeholder="Enter passing year"
                   required>

        </fieldset>

        <br>


        <!-- Course Information -->
        <fieldset>

            <legend><strong>Course Information</strong></legend>

            <!-- Course -->
            <label for="course">Course:</label>
            <br>

            <select id="course"
                    name="course"
                    required>

                <option value="">-- Select Course --</option>
                <option value="BTech">B.Tech</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="BSc">B.Sc</option>
                <option value="BCom">B.Com</option>

            </select>

            <br><br>


            <!-- Branch -->
            <label for="branch">Branch:</label>
            <br>

            <select id="branch"
                    name="branch"
                    required>

                <option value="">-- Select Branch --</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
                <option value="Electronics">Electronics</option>

            </select>

            <br><br>


            <!-- Admission Type -->
            <label for="admissionType">Admission Type:</label>
            <br>

            <select id="admissionType"
                    name="admissionType"
                    required>

                <option value="">-- Select Admission Type --</option>
                <option value="Regular">Regular</option>
                <option value="Management">Management</option>
                <option value="Merit">Merit</option>

            </select>

        </fieldset>

        <br>


        <!-- Address -->
        <fieldset>

            <legend><strong>Address</strong></legend>

            <!-- Address -->
            <label for="address">Address:</label>
            <br>

            <textarea id="address"
                      name="address"
                      rows="4"
                      cols="45"
                      placeholder="Enter your complete address"
                      autocomplete="street-address"
                      required></textarea>

            <br><br>


            <!-- City -->
            <label for="city">City:</label>
            <br>

            <input type="text"
                   id="city"
                   name="city"
                   placeholder="Enter your city"
                   autocomplete="address-level2"
                   required>

            <br><br>


            <!-- State -->
            <label for="state">State:</label>
            <br>

            <select id="state"
                    name="state"
                    autocomplete="address-level1"
                    required>

                <option value="">-- Select State --</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Goa">Goa</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Tamil Nadu">Tamil Nadu</option>

            </select>

            <br><br>


            <!-- Pincode -->
            <label for="pincode">Pincode:</label>
            <br>

            <input type="text"
                   id="pincode"
                   name="pincode"
                   placeholder="Enter 6-digit pincode"
                   maxlength="6"
                   autocomplete="postal-code"
                   required>

        </fieldset>

        <br>


        <!-- Other Information -->
        <fieldset>

        <legend><strong>Other Information</strong></legend>

            <!-- Hobbies -->
            <label for="hobbies">Hobbies:</label>
            <br>

            <input type="text"
                   id="hobbies"
                   name="hobbies"
                   placeholder="e.g. Reading, Cricket, Music">

            <br><br>


            <!-- Skills -->
            <label>Skills:</label>
            <br>

            <input type="checkbox"
                   id="html"
                   name="skills"
                   value="HTML">

            <label for="html">HTML</label>

            <br>

            <input type="checkbox"
                   id="css"
                   name="skills"
                   value="CSS">

            <label for="css">CSS</label>

            <br>

            <input type="checkbox"
                   id="javascript"
                   name="skills"
                   value="JavaScript">

            <label for="javascript">JavaScript</label>

            <br>

            <input type="checkbox"
                   id="java"
                   name="skills"
                   value="Java">

            <label for="java">Java</label>

            <br><br>


            <!-- Documents -->
            <label for="documents">Documents:</label>
            <br>

            <input type="file"
                   id="documents"
                   name="documents"
                   multiple
                   required>

            <br><br>


            <!-- Declaration -->
            <input type="checkbox"
                   id="declaration"
                   name="declaration"
                   required>

            <label for="declaration">
                I declare that the information provided by me is true and correct.
            </label>

        </fieldset>

        <br>


        <!-- Submit -->
        <input type="submit" value="Submit Admission Form">

        <input type="reset" value="Reset">

    </form>

</body>

</html>
