<!-- 24. Online Exam Registration Form 
Create an online exam registration page. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Exam Registration</title>
</head>

<body>

    <h1>Online Exam Registration Form</h1>

    <form autocomplete="on">

        <!-- Student Name -->
        <label for="studentName">Student Name:</label>
        <br>

        <input type="text"
               id="studentName"
               name="studentName"
               placeholder="Enter student name"
               autocomplete="name"
               required>

        <br><br>


        <!-- Email -->
        <label for="email">Email:</label>
        <br>

        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email"
               autocomplete="email"
               required>

        <br><br>


        <!-- Mobile -->
        <label for="mobile">Mobile:</label>
        <br>

        <input type="tel"
               id="mobile"
               name="mobile"
               placeholder="Enter your mobile number"
               autocomplete="tel"
               required>

        <br><br>


        <!-- Roll Number -->
        <label for="rollNumber">Roll Number:</label>
        <br>

        <input type="text"
               id="rollNumber"
               name="rollNumber"
               placeholder="Enter roll number"
               required>

        <br><br>


        <!-- Course -->
        <label for="course">Course:</label>
        <br>

        <select id="course"
                name="course"
                required>

            <option value="">-- Select Course --</option>
            <option value="BCA">BCA</option>
            <option value="BTech">B.Tech</option>
            <option value="BSc">B.Sc</option>
            <option value="BCom">B.Com</option>
            <option value="BBA">BBA</option>

        </select>

        <br><br>


        <!-- Semester -->
        <label for="semester">Semester:</label>
        <br>

        <select id="semester"
                name="semester"
                required>

            <option value="">-- Select Semester --</option>
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
            <option value="3">Semester 3</option>
            <option value="4">Semester 4</option>
            <option value="5">Semester 5</option>
            <option value="6">Semester 6</option>
            <option value="7">Semester 7</option>
            <option value="8">Semester 8</option>

        </select>

        <br><br>


        <!-- Subject -->
        <label for="subject">Subject:</label>
        <br>

        <select id="subject"
                name="subject"
                required>

            <option value="">-- Select Subject --</option>
            <option value="Java">Java</option>
            <option value="HTML">HTML</option>
            <option value="Database">Database</option>
            <option value="Computer Networks">Computer Networks</option>
            <option value="Operating System">Operating System</option>

        </select>

        <br><br>


        <!-- Exam Center -->
        <label for="examCenter">Exam Center:</label>
        <br>

        <select id="examCenter"
                name="examCenter"
                required>

            <option value="">-- Select Exam Center --</option>
            <option value="Pune">Pune</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Kolhapur">Kolhapur</option>
            <option value="Sangli">Sangli</option>
            <option value="Nashik">Nashik</option>

        </select>

        <br><br>


        <!-- Exam Date -->
        <label for="examDate">Exam Date:</label>
        <br>

        <input type="date"
               id="examDate"
               name="examDate"
               required>

        <br><br>


        <!-- Declaration -->
        <input type="checkbox"
               id="declaration"
               name="declaration"
               required>

        <label for="declaration">
            I declare that all the information provided by me is correct.
        </label>

        <br><br>


        <!-- Register -->
        <input type="submit" value="Register">

    </form>

</body>

</html>
