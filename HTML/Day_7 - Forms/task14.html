<!-- 14. Shipping Address Form 
Create a shipping address form.  -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shipping Address Form</title>
</head>

<body>

    <h1>Shipping Address Form</h1>

    <form autocomplete="on">

        <label for="fullName">Full Name:</label>
        <br>

        <input type="text"
               id="fullName"
               name="fullName"
               placeholder="Enter your full name"
               autocomplete="name"
               required>

        <br><br>


        <label for="mobile">Mobile Number:</label>
        <br>

        <input type="tel"
               id="mobile"
               name="mobile"
               placeholder="Enter your mobile number"
               autocomplete="tel"
               required>

        <br><br>


   
        <label for="house">House/Building:</label>
        <br>

        <input type="text"
               id="house"
               name="house"
               placeholder="Enter house/building name or number"
               required>

        <br><br>


   
        <label for="street">Street:</label>
        <br>

        <input type="text"
               id="street"
               name="street"
               placeholder="Enter street name"
               required>

        <br><br>



        <label for="city">City:</label>
        <br>

        <input type="text"
               id="city"
               name="city"
               placeholder="Enter your city"
               autocomplete="address-level2"
               required>

        <br><br>


        <label for="state">State:</label>
        <br>

        <select id="state"
                name="state"
                autocomplete="address-level1"
                required>

            <option value="">-- Select State --</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Goa">Goa</option>
            <option value="Gujarat">Gujarat</option>
            <option value="Tamil Nadu">Tamil Nadu</option>

        </select>

        <br><br>

        <label for="pincode">Pincode:</label>
        <br>

        <input type="text"
               id="pincode"
               name="pincode"
               placeholder="Enter 6-digit pincode"
               maxlength="6"
               autocomplete="postal-code"
               required>

        <br><br>


        <p><strong>Address Type:</strong></p>

        <input type="radio"
               id="home"
               name="addressType"
               value="Home"
               required>

        <label for="home">Home</label>

        <br>

        <input type="radio"
               id="office"
               name="addressType"
               value="Office">

        <label for="office">Office</label>

        <br><br>

    </form>

</body>

</html>
