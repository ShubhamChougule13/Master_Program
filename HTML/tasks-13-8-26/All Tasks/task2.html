<!--
Task 2 — Shopping Product
Create a product page containing:
• Product name
• Original price
• Discounted price
• Discount percentage
• Product description
• Use <del>, <ins>, <mark>, <strong> 
-->
    <!DOCTYPE html>
<html>
<head>
    <title>Shopping Product</title>
</head>

<body>

    <h1>Wireless Headphones</h1>

    <p>
        <strong>Original Price:</strong>
        <del>₹2,999</del>
    </p>

    <p>
        <strong>Discounted Price:</strong>
        <ins>₹1,999</ins>
    </p>

    <p>
        <strong>Discount:</strong>
        <mark>33% OFF</mark>
    </p>

    <p>
        <strong>Product Description:</strong>
        Enjoy high-quality sound with these comfortable
        wireless headphones. They provide clear audio,
        long battery life and easy Bluetooth connectivity.
    </p>

</body>
</html>
