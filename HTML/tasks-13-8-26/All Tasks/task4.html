<!--
Task 4 — Student Marksheet
Create a marksheet containing:
• Student name
• Roll number
• Five subjects
• Marks
• Percentage
• Grade
• Result
Use <strong>, <em> and <mark>
-->
<!DOCTYPE html>
<html>
<head>
    <title>Student Marksheet</title>
</head>

<body>

    <h1>Student Marksheet</h1>

    <p>
        <strong>Student Name:</strong> Shubham Chougule
    </p>

    <p>
        <strong>Roll Number:</strong> F097441
    </p>

    <h2>Subject Marks</h2>

    <p>
        <strong>Marathi:</strong> 94 / 100
    </p>

    <p>
        <strong>English:</strong> 92 / 100
    </p>

    <p>
        <strong>Science:</strong> 94 / 100
    </p>

    <p>
        <strong>Sanskrit:</strong> 95 / 100
    </p>

    <p>
        <strong>Mathematics:</strong> 93 / 100
    </p>

    <p>
        <strong>Social Science:</strong> 95 / 100
    </p>

    <p>
        <strong>Percentage:</strong>
        <mark>93.80%</mark>
    </p>

    <p>
        <strong>Grade:</strong>
        <em>A+</em>
    </p>

    <p>
        <strong>Result:</strong>
        <mark>PASS</mark>
    </p>

</body>
</html>
