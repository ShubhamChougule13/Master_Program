<!--
Task 1 — Personal Profile
Create a webpage containing:
• Name
• Age
• Education
• Skills
• Career goal
• Use id, class, and title
-->
<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile</title>
</head>

<body>

    <h1 id="name" title="My Full Name">Shubham Chougule</h1>

    <p class="profile" title="My Age">
        <b>Age:</b> 24
    </p>

    <p class="profile" title="My Education">
        <b>Education:</b> B.Tech in Computer Science and Engineering
    </p>

    <p class="skills" title="My Technical Skills">
        <b>Skills:</b> Java, HTML, CSS, JavaScript, React, Spring Boot
    </p>

    <p id="career-goal" class="profile" title="My Career Goal">
        <b>Career Goal:</b> To become a skilled Java Full Stack Developer.
    </p>

</body>
</html>
