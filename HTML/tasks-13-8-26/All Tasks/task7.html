<!--
Task 7 — Nested Elements Challenge
Create the following structure:
DIV
├── H1
├── P
│ ├── STRONG
│ └── EM
└── P
 ├── MARK
 └── SMALL

-->

<!DOCTYPE html>
<html>
<head>
    <title>Nested Elements Challenge</title>
</head>

<body>

    <div>

        <h1>My Personal Profile</h1>

        <p>
            <strong>My name is Shubham Chougule.</strong>
            I am <em>learning HTML and web development.</em>
        </p>

        <p>
            <mark>Welcome to my webpage!</mark>
            <small>This page is created using nested HTML elements.</small>
        </p>

    </div>

</body>
</html>
