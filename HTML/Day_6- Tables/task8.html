<!-- Task 8 – Restaurant Order Bill  -->
 <!DOCTYPE html>
<html>
<head>
    <title>Restaurant Order Bill</title>
</head>
<body>

    <h1>Restaurant Order Bill</h1>

    <table border="1">

        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Pizza</td>
                <td>2</td>
                <td>₹300</td>
                <td>₹600</td>
            </tr>

            <tr>
                <td>Burger</td>
                <td>2</td>
                <td>₹150</td>
                <td>₹300</td>
            </tr>

            <tr>
                <td>Pasta</td>
                <td>1</td>
                <td>₹250</td>
                <td>₹250</td>
            </tr>

            <tr>
                <td>Cold Coffee</td>
                <td>2</td>
                <td>₹100</td>
                <td>₹200</td>
            </tr>

            <!-- Bill Summary -->
            <tr>
                <td colspan="3">Subtotal</td>
                <td>₹1350</td>
            </tr>

            <tr>
                <td colspan="3">GST (5%)</td>
                <td>₹67.50</td>
            </tr>

            <tr>
                <td colspan="3">Discount</td>
                <td>₹100</td>
            </tr>

            <tr>
                <td colspan="3"><strong>Grand Total</strong></td>
                <td><strong>₹1317.50</strong></td>
            </tr>

        </tbody>

    </table>

</body>
</html>
