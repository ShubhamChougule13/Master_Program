<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodHub - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Bootstrap Navbar with Centered Links -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm sticky-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="index.html">FoodHub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <!-- Changed me-auto to mx-auto here -->
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active fw-bold" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="restaurants.html">Restaurants</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="offers.html">Offers</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <div class="d-flex gap-2">
          <a href="login.html" class="btn btn-outline-danger btn-sm px-3">Login</a>
          <a href="register.html" class="btn btn-danger btn-sm px-3">Register</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="content-area">
    <div class="card form-card-box p-4">
      <h3 class="text-center text-danger mb-3">Login</h3>
      <form action="#" method="post">
        <div class="mb-3">
          <label class="form-label small fw-bold">Email Address</label>
          <input type="email" class="form-control" placeholder="example@mail.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Password</label>
          <input type="password" class="form-control" placeholder="Enter password" required>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rem">
            <label class="form-check-label small" for="rem">Remember me</label>
          </div>
          <a href="#" class="text-danger small text-decoration-none">Forgot?</a>
        </div>
        <button type="submit" class="btn btn-danger w-100 mb-3">Login</button>
        <p class="text-center small mb-0">
          Don't have an account? <a href="register.html" class="text-danger text-decoration-none fw-bold">Register</a>
        </p>
      </form>
    </div>
  </div>

  <footer class="custom-footer">
    <div class="copyright-text">&copy; 2026 FoodHub. All Rights Reserved.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
