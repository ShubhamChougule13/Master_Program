  <div class="content-area">
    <div class="card form-card-box p-4" style="max-width: 550px;">
      <h3 class="text-center text-danger mb-3">Create an Account</h3>
      <form action="#" method="post">
        
        <div class="mb-2">
          <label class="form-label small fw-bold">Full Name</label>
          <input type="text" class="form-control form-control-sm" placeholder="Your name" required>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">Email</label>
          <input type="email" class="form-control form-control-sm" placeholder="example@mail.com" required>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">Mobile Number</label>
          <input type="tel" class="form-control form-control-sm" pattern="[0-9]{10}" placeholder="10-digit number" required>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">Password</label>
          <input type="password" class="form-control form-control-sm" minlength="6" placeholder="Min 6 characters" required>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">Confirm Password</label>
          <input type="password" class="form-control form-control-sm" minlength="6" placeholder="Re-type password" required>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">Date of Birth</label>
          <input type="date" class="form-control form-control-sm" required>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">Gender</label>
          <select class="form-select form-select-sm" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">City</label>
          <input type="text" class="form-control form-control-sm" placeholder="Your city" required>
        </div>

        <div class="mb-2">
          <label class="form-label small fw-bold">Address</label>
          <textarea class="form-control form-control-sm" rows="2" placeholder="Full address" required></textarea>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label small" for="terms">I accept the Terms & Conditions</label>
        </div>

        <button type="submit" class="btn btn-danger btn-sm w-100 mb-2">Create Account</button>
        
        <p class="text-center small mb-0">
          Already have an account? <a href="login.html" class="text-danger text-decoration-none fw-bold">Login</a>
        </p>

      </form>
    </div>
  </div>
